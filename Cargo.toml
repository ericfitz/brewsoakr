[package]
name = "brewsoakr"
version = "1.0.0"
edition = "2024"
description = "Homebrew wrapper that soaks formula and cask updates"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
ureq = "2"

[dev-dependencies]
tempfile = "3"
