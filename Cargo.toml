[package]
name = "brewsoak"
version = "1.0.1"
edition = "2024"
description = "Homebrew wrapper that soaks formula and cask updates"
license = "Apache-2.0"
repository = "https://github.com/ericfitz/brewsoakr"
readme = "README.md"
keywords = ["homebrew", "brew", "security"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
ureq = "2"

[dev-dependencies]
tempfile = "3"
